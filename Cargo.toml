[workspace]
resolver = "2"
members = ["crates/findit-core", "crates/findit-indexing", "src-tauri"]

# The single source of truth for the app version (Tauri reads it from the
# src-tauri package, which inherits it from here).
[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["FindIt contributors"]
rust-version = "1.85"
repository = "https://github.com/Yasen-magnit-za-025/FindIt"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
panic = "unwind"

[profile.bench]
inherits = "release"
strip = "none"
