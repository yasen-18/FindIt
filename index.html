<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FindIt</title>
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <div class="searchrow">
          <div class="searchbox" id="searchbox">
            <svg class="searchicon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 21 21" /></svg>
            <input id="q" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.label" />
            <button id="history-btn" class="iconbtn" type="button" data-i18n-title="search.history" aria-haspopup="listbox" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></svg>
            </button>
          </div>
          <div class="toggles" role="toolbar" data-i18n-aria="search.options">
            <button class="toggle" id="t-case" type="button" aria-pressed="false" data-i18n-title="toggles.matchCase"><span aria-hidden="true">Aa</span></button>
            <button class="toggle" id="t-word" type="button" aria-pressed="false" data-i18n-title="toggles.wholeWord"><span aria-hidden="true" class="wordglyph">ab</span></button>
            <button class="toggle" id="t-path" type="button" aria-pressed="false" data-i18n-title="toggles.matchPath"><span aria-hidden="true">\..\</span></button>
            <button class="toggle" id="t-diac" type="button" aria-pressed="false" data-i18n-title="toggles.diacritics"><span aria-hidden="true">é</span></button>
            <span class="sep" aria-hidden="true"></span>
            <button class="toggle" id="t-preview" type="button" aria-pressed="false" data-i18n-title="toggles.preview">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M14 5v14" /></svg>
            </button>
            <button class="iconbtn" id="help-btn" type="button" data-i18n-title="toggles.help">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.6" /><circle cx="12" cy="16.8" r=".6" class="fill" /></svg>
            </button>
            <button class="iconbtn" id="settings-btn" type="button" data-i18n-title="toggles.settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" /></svg>
            </button>
          </div>
        </div>
        <div id="hint" class="hint" role="alert" hidden></div>
        <div id="chips" class="chips" role="toolbar" data-i18n-aria="chips.label"></div>
      </header>
      <main class="content">
        <section id="grid" class="grid"></section>
        <aside id="preview" class="preview" hidden data-i18n-aria="preview.title"></aside>
      </main>
      <footer class="statusbar">
        <span id="st-results" class="st" aria-live="polite"></span>
        <span id="st-index" class="st grow"></span>
        <span id="st-selection" class="st"></span>
      </footer>
    </div>
    <div id="menu" class="menu" role="menu" hidden></div>
    <div id="history" class="history" role="listbox" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
