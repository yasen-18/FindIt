[package]
name = "findit-core"
description = "Index model, query parser, matcher, search engine and snapshot format for FindIt. No UI or OS dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
crc32fast = "1"
hashbrown = "0.15"
memchr = "2"
parking_lot = "0.12"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"

[[bench]]
name = "search"
harness = false

[lints]
workspace = true
